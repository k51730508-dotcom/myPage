<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="description" content="이름을 입력하고 따뜻한 환영 인사를 받아보세요.">
  <title>어서오세요 | 반가운 인사</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: #20251f;
      background: #f7f6f2;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: radial-gradient(ellipse at 50% 0%, #e9efdf 0, transparent 48%), #f7f6f2;
    }
    main { width: min(100%, 520px); text-align: center; }
    .mark {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 30px;
      border: 1px solid #d9e1cf;
      border-radius: 22px;
      color: #456342;
      background: #eef2e8;
      font-size: 29px;
      transform: rotate(-5deg);
    }
    .eyebrow {
      margin: 0 0 14px;
      color: #688064;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .18em;
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 8vw, 48px);
      font-weight: 750;
      letter-spacing: -.055em;
      line-height: 1.25;
    }
    .description {
      margin: 18px 0 34px;
      color: #777d73;
      font-size: 15px;
      line-height: 1.7;
    }
    .card {
      padding: 30px;
      border: 1px solid #e8e8e0;
      border-radius: 24px;
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 18px 55px rgba(42, 52, 36, .07);
      text-align: left;
    }
    label { display: block; margin-bottom: 10px; font-size: 14px; font-weight: 700; }
    .field { display: flex; gap: 10px; }
    input {
      width: 100%;
      min-width: 0;
      height: 54px;
      padding: 0 16px;
      border: 1px solid #dedfd7;
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: #20251f;
      font: inherit;
      transition: border-color .18s, box-shadow .18s;
    }
    input::placeholder { color: #a5a89f; }
    input:focus { border-color: #71896b; box-shadow: 0 0 0 4px #71896b22; }
    button {
      flex: 0 0 auto;
      min-height: 54px;
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      background: #3f5e3d;
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s, transform .18s;
    }
    button:hover { background: #314c30; transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #9eb490; outline-offset: 3px; }
    .greeting {
      min-height: 30px;
      margin: 22px 2px 0;
      color: #3f5e3d;
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -.03em;
    }
    .greeting:empty { display: none; }
    footer { margin-top: 28px; color: #a0a399; font-size: 12px; }
    @media (max-width: 440px) {
      .card { padding: 23px 19px; }
      .field { flex-direction: column; }
      button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✳</div>
    <p class="eyebrow">A LITTLE HELLO</p>
    <h1>오늘, 반가운 인사를<br>건네요</h1>
    <p class="description">이름을 알려주시면 따뜻하게 맞이할게요.</p>

    <form class="card" id="greeting-form">
      <label for="name">이름</label>
      <div class="field">
        <input id="name" name="name" type="text" placeholder="이름을 입력해 주세요" autocomplete="name" maxlength="40" required>
        <button type="submit">인사 받기 <span aria-hidden="true">→</span></button>
      </div>
      <p class="greeting" id="greeting" role="status" aria-live="polite"></p>
    </form>
    <footer>반가운 하루의 시작</footer>
  </main>
  <script>
    const form = document.querySelector('#greeting-form');
    const nameInput = document.querySelector('#name');
    const greeting = document.querySelector('#greeting');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      if (!name) {
        nameInput.focus();
        return;
      }
      greeting.textContent = `${name} 님, 어서오세요!`;
    });
  </script>
</body>
</html>
